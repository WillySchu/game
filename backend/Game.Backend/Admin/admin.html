<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raid Zero Admin</title>
<style>
  :root { --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #deded8; --accent: #2f6fde; --bad: #c43d3d; --ok: #2c8a4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --panel: #1f1f1f; --ink: #ececea; --quiet: #9a9a94; --line: #333331; --accent: #6a9cf2; --bad: #e06c6c; --ok: #5cbf7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  nav button { margin-right: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  section { display: none; } section.active { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; } h3 { font-size: 14px; margin: 12px 0 6px; }
  input, select, button { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } button.danger { color: var(--bad); border-color: var(--bad); }
  nav button.current { border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--quiet); font-weight: 500; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .quiet { color: var(--quiet); } .bad { color: var(--bad); } .ok { color: var(--ok); }
  a.link { color: var(--accent); cursor: pointer; text-decoration: none; } a.link:hover { text-decoration: underline; }
  ul.tree { list-style: none; padding-left: 16px; margin: 2px 0; } ul.tree.root { padding-left: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  #status { margin-left: auto; } pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Raid Zero Admin</h1>
  <nav>
    <button data-tab="players" class="current">Players</button>
    <button data-tab="raids">Raids</button>
    <button data-tab="items">Item lookup</button>
    <button data-tab="backups">Backups</button>
  </nav>
  <input id="token" type="password" placeholder="Admin token" size="28" autocomplete="off">
  <span id="status" class="quiet"></span>
</header>
<main>
  <section id="players" class="active">
    <div class="panel">
      <div class="row"><input id="playerQuery" placeholder="Name or player ID" size="32"><button id="searchPlayers" class="primary">Search</button></div>
      <table id="playerList"></table>
    </div>
    <div id="playerDetail"></div>
  </section>
  <section id="raids">
    <div class="panel">
      <div class="row"><label><input type="checkbox" id="allRaids"> Include finished raids</label><button id="loadRaids">Refresh</button></div>
      <div id="raidList"></div>
    </div>
  </section>
  <section id="items">
    <div class="panel">
      <div class="row"><input id="itemId" placeholder="Item ID" size="40"><button id="lookupItem" class="primary">Look up</button></div>
      <div id="itemDetail"></div>
    </div>
  </section>
  <section id="backups">
    <div class="panel">
      <div class="row"><button id="backupNow" class="primary">Back up now</button><button id="loadBackups">Refresh</button></div>
      <p class="quiet">Backups are full copies of the database, taken while the backend runs, kept next to it in a backups folder. Copy them off the server too.</p>
      <div id="backupList"></div>
    </div>
  </section>
</main>
<script>
// Everything is built with textContent, never innerHTML, so nothing from the database can inject markup.
const $ = id => document.getElementById(id);
const tokenBox = $('token');
tokenBox.value = sessionStorage.getItem('adminToken') || '';
tokenBox.addEventListener('change', () => sessionStorage.setItem('adminToken', tokenBox.value.trim()));

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'onclick') node.addEventListener('click', safe(v)); else if (k === 'class') node.className = v; else node.setAttribute(k, v);
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : String(child));
  return node;
}
// Errors are already shown in the status line by api(); this keeps them from escaping as unhandled rejections.
const safe = fn => (...args) => Promise.resolve().then(() => fn(...args)).catch(() => {});
const link = (text, onclick) => el('a', { class: 'link', onclick: safe(onclick) }, text);
const short = id => id ? id.slice(-8) : '';
function status(text, kind = 'quiet') { const s = $('status'); s.textContent = text; s.className = kind; }

async function api(method, path, body) {
  const token = tokenBox.value.trim();
  if (!token) { status('Paste the admin token first.', 'bad'); throw new Error('no token'); }
  sessionStorage.setItem('adminToken', token);
  const response = await fetch('/v1/admin' + path, {
    method, headers: { 'Authorization': 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : {};
  if (!response.ok) {
    const message = response.status === 401 ? 'Wrong admin token.' : (data.message || data.error || response.statusText);
    status(message, 'bad'); throw new Error(message);
  }
  if ($('status').className === 'bad') status('');  // a success clears a stale error, but never hides a real message
  return data;
}

for (const button of document.querySelectorAll('nav button')) {
  button.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('current', b === button));
    document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === button.dataset.tab));
    if (button.dataset.tab === 'raids') safe(loadRaids)();
    if (button.dataset.tab === 'backups') safe(loadBackups)();
  });
}
function showTab(name) { document.querySelector(`nav button[data-tab="${name}"]`).click(); }

// ---- players ----
async function searchPlayers() {
  const data = await api('GET', '/players?query=' + encodeURIComponent($('playerQuery').value.trim()));
  const table = $('playerList'); table.replaceChildren(el('tr', {}, el('th', {}, 'Name'), el('th', {}, 'ID'), el('th', {}, 'Version'), el('th', {}, 'Created'), el('th', {}, 'In raid')));
  for (const p of data.players) {
    table.append(el('tr', {},
      el('td', {}, link(p.display_name, () => openPlayer(p.id))), el('td', { class: 'mono' }, p.id), el('td', {}, p.profile_version),
      el('td', { class: 'quiet' }, p.created_at.slice(0, 19).replace('T', ' ')), el('td', {}, p.live_raid_id ? short(p.live_raid_id) : '')));
  }
  if (!data.players.length) table.append(el('tr', {}, el('td', { class: 'quiet' }, 'No players match.')));
}

function tree(node, depth = 0) {
  const where = node.slot === 'grid' ? ` @(${node.x},${node.y})${node.rotated ? ' rot' : ''}` : node.slot ? ` [${node.slot}]` : '';
  const quantity = node.quantity > 1 ? ` ×${node.quantity}` : '';
  const durability = node.durability != null ? ` ${Math.round(node.durability * 100)}%` : '';
  const item = el('li', {}, link(node.def_id, () => lookupItem(node.id)), el('span', { class: 'quiet' }, quantity + durability + where + ' ', el('code', {}, short(node.id))));
  if (node.children?.length) item.append(el('ul', { class: 'tree' }, node.children.map(c => tree(c, depth + 1))));
  return depth === 0 ? el('ul', { class: 'tree root' }, item) : item;
}

function ledgerTable(entries) {
  const table = el('table', {}, el('tr', {}, el('th', {}, 'When'), el('th', {}, 'Kind'), el('th', {}, 'Raid'), el('th', {}, 'Detail')));
  for (const e of entries) {
    table.append(el('tr', {}, el('td', { class: 'quiet mono' }, e.created_at.slice(0, 19).replace('T', ' ')), el('td', {}, e.kind),
      el('td', { class: 'mono' }, e.raid_id ? short(e.raid_id) : ''), el('td', {}, el('pre', { class: 'mono' }, JSON.stringify(e.detail)))));
  }
  return table;
}

let catalog = null;
async function openPlayer(id) {
  const [p, cat] = await Promise.all([api('GET', '/players/' + id), catalog ? Promise.resolve(catalog) : api('GET', '/catalog')]);
  catalog = cat;
  const defs = el('select', {}, cat.items.map(i => el('option', { value: i.def_id }, `${i.def_id}${i.max_stack > 1 ? ` (stacks to ${i.max_stack})` : ''}`)));
  const quantity = el('input', { type: 'number', min: '1', value: '1', style: 'width:90px' });
  const note = el('input', { placeholder: 'Why (goes in the ledger)', size: '30' });
  const grant = el('button', { class: 'primary', onclick: async () => {
    const result = await api('POST', `/players/${id}/grants`, { items: [{ def_id: defs.value, quantity: Number(quantity.value) }], note: note.value });
    await openPlayer(id);
    status(`Granted ${result.granted.map(g => g.def_id).join(', ')}.`, 'ok');
  } }, 'Grant');

  $('playerDetail').replaceChildren(
    el('div', { class: 'panel' },
      el('h2', {}, p.player.display_name, ' ', el('span', { class: 'quiet mono' }, p.player.id)),
      el('div', { class: 'quiet' }, `Profile version ${p.player.profile_version}. `, p.player.live_raid_id ? el('span', { class: 'bad' }, `In raid ${short(p.player.live_raid_id)}: stash locked.`) : 'Not in a raid.'),
      el('div', { class: 'row' }, 'Grant into stash:', defs, quantity, note, grant)),
    el('div', { class: 'grid2' },
      el('div', { class: 'panel' }, el('h2', {}, 'Character'), tree(p.character)),
      el('div', { class: 'panel' }, el('h2', {}, 'Stash'), tree(p.stash))),
    el('div', { class: 'panel' }, el('h2', {}, 'Ledger (newest first)'), ledgerTable(p.ledger)));
}

// ---- raids ----
async function loadRaids() {
  const data = await api('GET', '/raids' + ($('allRaids').checked ? '?all=true' : ''));
  const list = $('raidList');
  if (!data.raids.length) { list.replaceChildren(el('p', { class: 'quiet' }, 'No raids to show.')); return; }
  list.replaceChildren(...data.raids.map(r => el('div', { class: 'panel' },
    el('div', { class: 'row' }, el('strong', {}, r.map_id), el('span', { class: r.state === 'active' ? 'ok' : 'quiet' }, r.state),
      el('span', { class: 'quiet' }, `on ${r.server_id}, started ${(r.started_at || r.created_at).slice(11, 19)}, lease until ${r.lease_expires_at.slice(11, 19)}`),
      el('span', { class: 'mono quiet' }, r.id),
      ['pending', 'active'].includes(r.state) ? el('button', { class: 'danger', onclick: async () => {
        if (!confirm('Abort this raid? Everyone still inside gets their gear back, as if the server had crashed.')) return;
        await api('POST', `/raids/${r.id}/abort`); await loadRaids(); status('Raid aborted; everyone inside was refunded.', 'ok');
      } }, 'Abort and refund') : null),
    el('table', {}, el('tr', {}, el('th', {}, 'Player'), el('th', {}, 'State'), el('th', {}, 'Joined'), el('th', {}, 'Left')),
      r.participants.map(p => el('tr', {}, el('td', {}, link(p.display_name, () => { showTab('players'); openPlayer(p.player_id); })),
        el('td', {}, p.state), el('td', { class: 'quiet' }, (p.joined_at || '').slice(11, 19)), el('td', { class: 'quiet' }, (p.resolved_at || '').slice(11, 19))))))));
}

// ---- items ----
async function lookupItem(id) {
  if (id) { $('itemId').value = id; showTab('items'); }
  const data = await api('GET', '/items/' + encodeURIComponent($('itemId').value.trim()));
  const i = data.item;
  const facts = [['Item', i.def_id], ['State', i.state], ['Owner', i.owner_name ? `${i.owner_name} (${short(i.owner_id)})` : '—'],
    ['In raid', i.raid_id || '—'], ['Position', i.parent_id ? `${i.slot}${i.grid_x != null ? ` @(${i.grid_x},${i.grid_y})` : ''} in ${short(i.parent_id)}` : '—'],
    ['Quantity', i.quantity], ['Durability', i.durability ?? '—'], ['Origin', i.origin + (i.origin_raid_id ? ` (raid ${short(i.origin_raid_id)})` : '')],
    ['Created', i.created_at], ['Updated', i.updated_at]];
  $('itemDetail').replaceChildren(el('table', {}, facts.map(([k, v]) => el('tr', {}, el('th', {}, k), el('td', {}, v)))),
    el('h3', {}, 'History (oldest first)'), ledgerTable(data.history));
}

// ---- backups ----
async function loadBackups() {
  const data = await api('GET', '/backups');
  $('backupList').replaceChildren(el('p', { class: 'quiet mono' }, data.folder),
    data.backups.length ? el('table', {}, el('tr', {}, el('th', {}, 'File'), el('th', {}, 'Size')),
      data.backups.map(b => el('tr', {}, el('td', { class: 'mono' }, b.file), el('td', {}, `${(b.bytes / 1024).toFixed(0)} KB`)))) : el('p', { class: 'quiet' }, 'No backups yet.'));
}

$('searchPlayers').addEventListener('click', safe(searchPlayers));
$('playerQuery').addEventListener('keydown', e => { if (e.key === 'Enter') safe(searchPlayers)(); });
$('loadRaids').addEventListener('click', safe(loadRaids));
$('allRaids').addEventListener('change', safe(loadRaids));
$('lookupItem').addEventListener('click', safe(() => lookupItem()));
$('itemId').addEventListener('keydown', e => { if (e.key === 'Enter') safe(lookupItem)(); });
$('backupNow').addEventListener('click', safe(async () => { const b = await api('POST', '/backups'); await loadBackups(); status(`Saved ${b.file}.`, 'ok'); }));
$('loadBackups').addEventListener('click', safe(loadBackups));
</script>
</body>
</html>
