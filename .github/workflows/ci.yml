# Builds and tests everything on every push and pull request. On main, also builds the backend container
# image and pushes it to GitHub Container Registry as ghcr.io/<owner>/<repo>/backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The backend and tests don't need the Unity project's LFS assets, so skip downloading them.
      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this also enforces the shared code's C# 9 limit.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Includes the check that item_catalog.json's catalog_version matches its contents.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFilePrefix=results"
          --results-directory artifacts/test-results

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  image:
    name: Backend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      # QEMU runs the one RUN step of the arm64 runtime stage; the .NET build itself runs natively (see the Dockerfile).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags each image with its commit (sha-abc1234) and moves "latest" along with main.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          # amd64 for most VPSes, arm64 for Apple Silicon Macs and ARM servers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
